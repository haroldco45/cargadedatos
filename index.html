<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carga de Datos - Vibras Positivas HM</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background: #f4f4f4; }
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        button { background: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; }
        #status { margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Subir Inventario Excel</h2>
        <input type="file" id="excelFile" accept=".xlsx, .xls" />
        <br><br>
        <button onclick="procesarArchivo()">Subir a MongoDB</button>
        <div id="status"></div>
    </div>

    <script>
        async function procesarArchivo() {
            const input = document.getElementById('excelFile');
            const status = document.getElementById('status');
            
            if (input.files.length === 0) {
                status.innerText = "Por favor, selecciona un archivo.";
                return;
            }

            const file = input.files[0];
            const reader = new FileReader();

            reader.onload = async (e) => {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const sheetName = workbook.SheetNames[0];
                const jsonData = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName]);

                status.innerText = "Enviando datos a MongoDB...";

                // Aquí se envía al backend
                try {
                    const response = await fetch('https://tu-api-servidor.com/upload', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ datos: jsonData })
                    });
                    if (response.ok) status.innerText = "¡Datos cargados con éxito!";
                } catch (err) {
                    status.innerText = "Error al conectar con el servidor.";
                }
            };
            reader.readAsArrayBuffer(file);
        }
    </script>
</body>
</html>
