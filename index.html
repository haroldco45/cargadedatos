<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartera - Vibras Positivas HM</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#007bff">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root { --primary: #007bff; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .card { background: white; width: 100%; max-width: 420px; padding: 30px; border-radius: 25px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); text-align: center; }
        .brand { font-weight: bold; color: var(--primary); font-size: 1.6rem; margin-bottom: 5px; }
        .drop-zone { border: 2px dashed #bbb; padding: 40px 20px; border-radius: 15px; margin: 25px 0; color: #666; cursor: pointer; transition: 0.3s; }
        .drop-zone.active { border-color: var(--primary); background: #e7f1ff; color: var(--primary); }
        button { background: var(--primary); color: white; border: none; padding: 18px; width: 100%; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 1rem; }
        button:disabled { background: #ccc; }
        #status { margin-top: 20px; padding: 12px; border-radius: 10px; font-size: 0.9rem; display: none; line-height: 1.4; }
        .footer { margin-top: 40px; font-size: 0.75rem; color: #999; text-transform: uppercase; letter-spacing: 1px; }
    </style>
</head>
<body>

    <div class="card">
        <div class="brand">VIBRAS POSITIVAS HM</div>
        <div style="color: #888; font-size: 0.8rem;">Caucasia - Gestión de Cartera</div>
        
        <div class="drop-zone" id="dropZone">
            Arrastra tu archivo Excel aquí <br> o toca para seleccionar
            <input type="file" id="excelFile" accept=".xlsx, .xls" style="display: none;" />
        </div>

        <button id="btnSync">Sincronizar con MongoDB</button>
        <div id="status"></div>
    </div>

    <div class="footer">
        © 2026 Vibras Positivas HM<br>Tecnología para el campo y la ciudad
    </div>

    <script>
        // Registro de PWA para instalación
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js');
        }

        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('excelFile');
        const btnSync = document.getElementById('btnSync');
        const status = document.getElementById('status');

        dropZone.onclick = () => fileInput.click();

        fileInput.onchange = (e) => {
            if(e.target.files.length > 0) {
                dropZone.innerText = "Archivo: " + e.target.files[0].name;
                dropZone.classList.add('active');
            }
        };

        btnSync.onclick = async () => {
            if (!fileInput.files[0]) return alert("Por favor, selecciona un archivo primero");

            const reader = new FileReader();
            btnSync.disabled = true;
            btnSync.innerText = "Procesando...";

            reader.onload = async (e) => {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const sheet = workbook.Sheets[workbook.SheetNames[0]];
                    
                    // Convertimos el Excel a JSON (usando la primera hoja)
                    const rawData = XLSX.utils.sheet_to_json(sheet);
                    
                    if (rawData.length === 0) throw new Error("Archivo vacío");

                    await enviarAMongo(rawData);
                } catch (err) {
                    showStatus("Error: " + err.message, "#dc3545");
                } finally {
                    btnSync.disabled = false;
                    btnSync.innerText = "Sincronizar con MongoDB";
                }
            };
            reader.readAsArrayBuffer(fileInput.files[0]);
        };

        async function enviarAMongo(datos) {
            showStatus("Enviando " + datos.length + " registros a la nube...", "#007bff");
            
            try {
                // AQUÍ DEBES PONER LA URL DE TU API O ATLAS DATA API
                const response = await fetch('https://tu-api-servidor.com/cartera', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        registros: datos,
                        usuario: "Harold Marin",
                        fecha_carga: new Date().toISOString()
                    })
                });

                if (response.ok) {
                    showStatus("¡Sincronización Exitosa! Datos guardados en MongoDB.", "#28a745");
                } else {
                    showStatus("Error en el servidor. Revisa la conexión.", "#dc3545");
                }
            } catch (err) {
                showStatus("No se pudo conectar con MongoDB.", "#dc3545");
            }
        }

        function showStatus(msg, color) {
            status.style.display = "block";
            status.innerText = msg;
            status.style.color = color;
            status.style.backgroundColor = color + "11";
        }
    </script>
</body>
</html>
