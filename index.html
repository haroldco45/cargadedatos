<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Cartera - Vibras Positivas HM</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#007bff">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root { --primary: #007bff; --success: #28a745; --dark: #343a40; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f4f7f6; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .card { background: white; width: 100%; max-width: 400px; padding: 25px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; }
        .brand { font-weight: bold; color: var(--primary); font-size: 1.4rem; margin-bottom: 5px; }
        .version { font-size: 0.7rem; color: #999; margin-bottom: 20px; }
        .drop-zone { border: 2px dashed #ccc; padding: 30px 10px; border-radius: 15px; margin-bottom: 20px; color: #777; transition: 0.3s; }
        .drop-zone.active { border-color: var(--primary); background: #e7f1ff; }
        button { background: var(--primary); color: white; border: none; padding: 15px; width: 100%; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 1rem; transition: 0.3s; }
        button:disabled { background: #ccc; }
        #status { margin-top: 20px; padding: 10px; border-radius: 8px; font-size: 0.9rem; display: none; }
        .footer { margin-top: 30px; font-size: 0.75rem; color: #888; line-height: 1.5; }
    </style>
</head>
<body>

    <div class="card">
        <div class="brand">VIBRAS POSITIVAS HM</div>
        <div class="version">Sistema de Gestión de Cartera v1.0</div>
        
        <div class="drop-zone" id="dropZone">
            Arrastra tu archivo .xlsx aquí <br> o haz clic para buscar
            <input type="file" id="excelFile" accept=".xlsx, .xls" style="display: none;" />
        </div>

        <button id="btnSync">Sincronizar con MongoDB</button>
        <div id="status"></div>
    </div>

    <div class="footer">
        © 2026 Derechos de Autor: Vibras Positivas<br>
        Desarrollado para Caucasia, Antioquia
    </div>

    <script>
        // Registro de PWA
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js');
        }

        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('excelFile');
        const btnSync = document.getElementById('btnSync');
        const status = document.getElementById('status');

        dropZone.onclick = () => fileInput.click();

        fileInput.onchange = (e) => {
            if(e.target.files.length > 0) {
                dropZone.innerText = "Archivo listo: " + e.target.files[0].name;
                dropZone.classList.add('active');
            }
        };

        btnSync.onclick = async () => {
            if (!fileInput.files[0]) return alert("Selecciona un archivo");

            const reader = new FileReader();
            setLoading(true);

            reader.onload = async (e) => {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const sheet = workbook.Sheets[workbook.SheetNames[0]];
                    const json = XLSX.utils.sheet_to_json(sheet);

                    await enviarDatos(json);
                } catch (err) {
                    showStatus("Error al procesar el archivo", "#dc3545");
                } finally {
                    setLoading(false);
                }
            };
            reader.readAsArrayBuffer(fileInput.files[0]);
        };

        async function enviarDatos(datos) {
            showStatus("Enviando " + datos.length + " registros...", "#007bff");
            try {
                // Reemplazar con la URL de tu API o MongoDB Atlas Data API
                const response = await fetch('https://tu-servidor.com/api/cartera', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        registros: datos, 
                        ubicacion: "Caucasia",
                        fecha: new Date().toISOString()
                    })
                });

                if (response.ok) showStatus("¡Sincronización completa!", "#28a745");
                else showStatus("Error en el servidor", "#dc3545");
            } catch (err) {
                showStatus("Sin conexión con MongoDB", "#dc3545");
            }
        }

        function showStatus(msg, color) {
            status.style.display = "block";
            status.innerText = msg;
            status.style.color = color;
            status.style.backgroundColor = color + "11";
        }

        function setLoading(val) {
            btnSync.disabled = val;
            btnSync.innerText = val ? "Procesando..." : "Sincronizar con MongoDB";
        }
    </script>
</body>
</html>
