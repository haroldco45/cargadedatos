<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carga de Datos - Vibras Positivas HM</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#007bff">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <style>
        :root {
            --primary-color: #007bff;
            --bg-color: #f8f9fa;
        }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            padding: 20px; 
            background-color: var(--bg-color);
            margin: 0;
        }
        .container {
            max-width: 500px;
            margin: 50px auto;
        }
        .card { 
            background: white; 
            padding: 30px; 
            border-radius: 20px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
        }
        h2 { color: #333; margin-bottom: 20px; }
        input[type="file"] {
            margin: 20px 0;
            padding: 10px;
            width: 100%;
            box-sizing: border-box;
        }
        button { 
            background: var(--primary-color); 
            color: white; 
            border: none; 
            padding: 12px 25px; 
            border-radius: 8px; 
            font-size: 16px;
            font-weight: bold;
            cursor: pointer; 
            width: 100%;
            transition: background 0.3s ease;
        }
        button:hover { background: #0056b3; }
        #status { 
            margin-top: 25px; 
            padding: 10px;
            border-radius: 5px;
            font-weight: 500; 
        }
        .footer {
            margin-top: 40px;
            font-size: 0.8rem;
            color: #777;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <h2>Vibras Positivas HM</h2>
            <p>Carga tu archivo Excel para MongoDB</p>
            
            <input type="file" id="excelFile" accept=".xlsx, .xls" />
            <br>
            <button id="btnSubir">Subir a MongoDB</button>
            
            <div id="status"></div>
        </div>

        <div class="footer">
            <p>&copy; 2026 Derechos de Autor: Vibras Positivas</p>
        </div>
    </div>

    <script>
        // 1. Registro del Service Worker para soporte PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('SW registrado con éxito'))
                    .catch(err => console.error('Error al registrar SW', err));
            });
        }

        // 2. Lógica de procesamiento de archivo
        document.getElementById('btnSubir').addEventListener('click', async () => {
            const input = document.getElementById('excelFile');
            const status = document.getElementById('status');
            
            if (input.files.length === 0) {
                mostrarEstado("Por favor, selecciona un archivo.", "red");
                return;
            }

            const file = input.files[0];
            const reader = new FileReader();

            mostrarEstado("Procesando archivo...", "blue");

            reader.onload = async (e) => {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const sheetName = workbook.SheetNames[0];
                    const jsonData = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName]);

                    if (jsonData.length === 0) {
                        mostrarEstado("El archivo está vacío.", "orange");
                        return;
                    }

                    enviarADatabase(jsonData);
                } catch (error) {
                    mostrarEstado("Error al leer el Excel.", "red");
                }
            };
            reader.readAsArrayBuffer(file);
        });

        async function enviarADatabase(datos) {
            const status = document.getElementById('status');
            mostrarEstado("Enviando datos a la nube...", "blue");

            try {
                // REEMPLAZAR con la URL real de tu API conectada a MongoDB
                const response = await fetch('https://tu-servidor-api.com/upload', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        registros: datos,
                        usuario: "Harold Marin",
                        fecha: new Date().toISOString()
                    })
                });

                if (response.ok) {
                    mostrarEstado("¡Éxito! Datos sincronizados con MongoDB.", "green");
                } else {
                    mostrarEstado("Error en el servidor al guardar.", "red");
                }
            } catch (err) {
                mostrarEstado("Error de conexión. Verifica tu internet.", "red");
            }
        }

        function mostrarEstado(mensaje, color) {
            const status = document.getElementById('status');
            status.innerText = mensaje;
            status.style.color = color;
        }
    </script>
</body>
</html>
